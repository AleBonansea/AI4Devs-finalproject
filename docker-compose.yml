# Postgres local para desarrollo y para los tests. La misma version mayor
# que produccion: la base de los tests no se finge.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: escuelita
      POSTGRES_PASSWORD: escuelita
      POSTGRES_DB: escuelita
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuelita"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos:
