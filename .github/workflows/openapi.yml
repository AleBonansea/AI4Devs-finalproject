name: Contrato de la API

# El contrato versionado tiene que coincidir con lo que la aplicacion
# expone de verdad. Si no se materializa en un archivo, no se puede
# comparar: un contrato que solo existe en tiempo de ejecucion no se
# diferencia contra nada.

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "docs/api/openapi.json"

jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Generar el contrato no abre ninguna conexion -create_engine es
      # perezoso-, pero la configuracion se valida al importar la aplicacion
      # y estas dos son obligatorias. Sin ellas el paso muere antes de
      # empezar, con un error de validacion que no dice nada del contrato.
      DATABASE_URL: postgresql+psycopg://nadie:nadie@localhost:5432/no-se-conecta
      SECRET_KEY: clave-de-juguete-del-ci-no-se-usa-en-ningun-lado

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerar el contrato
        run: python tasks.py openapi-generate

      - name: Comprobar que estaba al dia
        run: |
          if ! git diff --exit-code -- docs/api/openapi.json; then
            echo ""
            echo "::error::docs/api/openapi.json no coincide con el codigo."
            echo "Corre 'python tasks.py openapi-generate' y agrega el archivo al commit."
            exit 1
          fi
