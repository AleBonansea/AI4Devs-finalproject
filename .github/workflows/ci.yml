name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # La misma version mayor que produccion. La base de los tests no se finge:
        # la mitad de los errores de este sistema son de restricciones y de tipos
        # numericos, y con SQLite no aparecen.
        image: postgres:16
        env:
          POSTGRES_USER: escuelita
          POSTGRES_PASSWORD: escuelita
          POSTGRES_DB: escuelita_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://escuelita:escuelita@localhost:5432/escuelita_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tipos
        run: mypy app

      - name: Migraciones
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
