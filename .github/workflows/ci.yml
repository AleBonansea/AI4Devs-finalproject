name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # La misma version mayor que produccion. La base de los tests no se finge:
        # la mitad de los errores de este sistema son de restricciones y de tipos
        # numericos, y con SQLite no aparecen.
        image: postgres:16
        env:
          POSTGRES_USER: escuelita
          POSTGRES_PASSWORD: escuelita
          POSTGRES_DB: escuelita
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dos bases distintas, como en local: conftest.py se niega a correr los
      # tests contra la de desarrollo, porque un test que revierte mal la
      # dejaria vacia.
      DATABASE_URL: postgresql+psycopg://escuelita:escuelita@localhost:5432/escuelita
      TEST_DATABASE_URL: postgresql+psycopg://escuelita:escuelita@localhost:5432/escuelita_test
      # Clave de juguete, solo para que la configuracion valide. No firma nada
      # que salga de este runner. La de produccion vive en el panel de Render.
      SECRET_KEY: clave-de-juguete-del-ci-no-se-usa-en-ningun-lado
      PGPASSWORD: escuelita

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Crear la base de pruebas
        run: psql -h localhost -U escuelita -d escuelita -c "CREATE DATABASE escuelita_test"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"

      # De aca en adelante, los mismos comandos que se corren en local. Si el
      # lanzador se rompe, el CI se entera.
      - name: Lint
        run: python tasks.py lint

      - name: Tipos
        run: python tasks.py typecheck

      - name: Migraciones, ida y vuelta
        working-directory: backend
        run: |
          alembic upgrade head
          # Que la migracion sea reversible no se da por sentado: un downgrade
          # vacio o que olvida borrar un tipo enumerado pasa inadvertido hasta
          # que alguien necesita volver atras.
          alembic downgrade -1
          alembic upgrade head

      - name: Tests
        run: python tasks.py test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # El huso de la escuela, como en tasks.py y vite.config.ts. El runner
      # esta en UTC, donde la fecha local y la de toISOString() coinciden
      # hasta las 21 h de Argentina y un test de la fecha de hoy no discrimina.
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python tasks.py front-lint
      - run: python tasks.py front-test
